spring.application.name=Employeeservice
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:mysql://localhost:3306/EmployeeManagement
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
 server.port=8080
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.openfeign.circuitbreaker.enabled=true
ressilance4j.circuitbreaker.instances.employeeCB.register-health-indicator=true
resillience4j.circuitbreaker.instances.employeeCB.sliding-window-size=5
resillince4j.circuitbreaker.instance.employeeCB.failure-rate-threshold=50
resillience4j.circuitbreaker.instances.employeeCB.wait-duration-in-open-state=10
resillience4j.circuitbreaker.instances.employeeCB.permitted-number-of-calls-in-half-open-state=2
resillience4j.circuitbreaker.instances.employeeCB.automatic-transition-from-open-to-half-open-enables=true
resillience4j.circuitbreaker.instances.employeeCB.minimum-number-of-calls=3
